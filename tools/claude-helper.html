<title>會議整理台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面：單欄工作台，三張卡依流程排列（貼上 → 整理中 → 結果），和 App 的海玻璃色系一致 */
:root{
  --bg:#E6ECEA; --surface:#F6F8F7; --ink:#1C2A2D; --sub:#5A6B6E; --line:#C9D4D2;
  --accent:#2E6A69; --accent-ink:#F3FAF9; --soft:#DCE7E4; --warn:#9A5B12; --bad:#A43A2E; --ok:#2F6B3A;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111819; --surface:#1A2324; --ink:#E4ECEA; --sub:#9AAEAD; --line:#2E3C3D; --accent:#6FB3B0; --accent-ink:#0C1717; --soft:#223031; --warn:#E0A55A; --bad:#EE8A7C; --ok:#8CCB95; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111819; --surface:#1A2324; --ink:#E4ECEA; --sub:#9AAEAD; --line:#2E3C3D; --accent:#6FB3B0; --accent-ink:#0C1717; --soft:#223031; --warn:#E0A55A; --bad:#EE8A7C; --ok:#8CCB95; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header h1{font-family:var(--display);font-size:1.6rem;margin:0;letter-spacing:.04em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--sub);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.card h2{margin:0;font-size:1rem;display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.75rem;font-weight:700}
textarea{width:100%;min-height:120px;resize:vertical;border:1px dashed var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;padding:12px}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--sub);font-size:.85rem;margin:0}
.job{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem;background:var(--soft);border-radius:12px;padding:10px 12px}
.job dt{color:var(--sub)} .job dd{margin:0;min-width:0;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border-radius:999px;padding:10px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:default}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s ease}
.stage{font-size:.92rem} .meta{color:var(--sub);font-size:.8rem;font-variant-numeric:tabular-nums}
.msg{font-size:.88rem;border-radius:10px;padding:8px 12px;background:var(--soft)} .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.sum h3{font-family:var(--display);margin:6px 0 2px;font-size:1.05rem}
.sum ul{margin:4px 0 6px;padding-left:1.2em} .sum li{margin:2px 0}
.sum .ov{margin:0}
.sum .t{color:var(--sub);font-size:.8rem;font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.out{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;max-height:50vh;overflow:auto;font-size:.92rem;min-width:0}
#raw{min-height:70px;font-size:.75rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>會議整理台</h1>
    <p>AI翻譯會議 App 的好幫手：用你的 Claude 方案修正錯字、整理重點、翻譯，不用另外的 API 金鑰。</p>
  </header>

  <section class="card" id="c1">
    <h2><span class="step">1</span>貼上 App 複製的內容</h2>
    <p class="hint">在 App 按「✨ 用 Claude 整理」或「✨ 用 Claude 翻譯」，App 會自動複製並打開這一頁。在下面的框長按 → 貼上，就會自動開始。</p>
    <textarea id="inp" placeholder="長按這裡 → 貼上" aria-label="貼上 App 複製的內容"></textarea>
    <dl class="job" id="job" hidden></dl>
    <div class="row"><button class="pri" id="go" disabled>開始</button><button id="stop" hidden>停止</button></div>
    <div class="msg" id="m1" hidden></div>
  </section>

  <section class="card" id="c2" hidden>
    <h2><span class="step">2</span>Claude 處理中</h2>
    <div class="bar"><i id="pb"></i></div>
    <div class="stage" id="st">準備中…</div>
    <div class="meta" id="mt"></div>
  </section>

  <section class="card" id="c3" hidden>
    <h2><span class="step">3</span>完成：複製結果，回到 App</h2>
    <div class="row"><button class="pri" id="cp">📋 複製結果</button></div>
    <div class="msg" id="m3" hidden></div>
    <p class="hint">回到 App 後會自動偵測剪貼簿裡的結果，問你要不要套用。沒有自動跳出時，到會議頁按「📋 貼上 Claude 結果」。</p>
    <div id="view"></div>
    <details><summary class="hint">複製按鈕沒反應時：手動全選下面的文字複製</summary><textarea id="raw" readonly aria-label="結果原始文字"></textarea></details>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sample=null,JOB=null,RES='',ctl=null,t0=0,tick=null,busy=false;
const FIX=`你是台灣的會議逐字稿校對員。輸入是語音辨識（ASR）產生的逐字稿，每行格式為「編號|講者|內容」。
語音辨識常把發音相近的詞聽錯，請像真人校對一樣，依上下文和發音推敲出正確的詞：人名、台灣地名、學校科系、公司、產品、法規、文件編號、同音或近音錯字、斷錯的詞、英文術語的拼寫與大小寫、明顯漏掉或多餘的字與標點。
規則：1. 只修正辨識錯誤，保留原本語意、語氣與口語用詞，不要改寫成書面語、不要摘要、不要刪內容。2. 使用台灣繁體中文與台灣慣用詞；英文保持英文。3. 有提供專有名詞或常見辨識錯誤時，發音相近的詞優先改成那些寫法。4. 無法判斷就維持原樣。
5. 只輸出 JSON 物件：{"編號":"修正後內容",...}，只列出有修改的行；沒有修改就輸出 {}。`;
const SUM=`你是專業的會議記錄撰寫人。輸入是一整場會議的逐字稿（已校對），每行格式為「[時間] 講者：內容」。請整理成完整的會議重點，只輸出 JSON：
{"title":"會議標題（15 字內）","overview":"整場會議摘要（3～5 句）","chapters":[{"title":"章節標題（12 字內）","start":"開始時間","end":"結束時間","summary":"本章摘要（1～2 句）","points":["重點"]}],"decisions":["已決定的事項"],"actions":[{"owner":"負責人（不知道寫 未指定）","task":"待辦事項","due":"期限"}],"keywords":["關鍵字"]}
寫法：1. 章節依內容 3～8 章，依時間排序，相同主題合併。2. 每章 2～4 點、每點 20～45 字；寒暄、重複、離題不要寫。3. 用論述方式寫事情本身：「現況或問題 → 原因或影響 → 建議、做法或結論」，不要逐句轉述，不要用「某某說」「某某表示」開頭，只有指出誰負責、誰提出要求時才寫人名。4. 保留關鍵數字、文件編號、法規、日期與專有名詞，以逐字稿用字為準。5. due 只有逐字稿明確說出期限時才照原話填，不要推算、不要填時間戳記，沒有就填空字串。
使用台灣繁體中文；講者用逐字稿上的名稱；不要編造逐字稿沒有的內容。`;
const ERR={not_granted:'你沒有允許這一頁使用 Claude。重新整理頁面後再按一次「開始」，在跳出的視窗按允許。',rate_limited:'你的 Claude 方案用量暫時到上限，請稍後再試。',session_expired:'Claude 登入已過期，請重新登入 claude.ai 後再開這一頁。',sampling_disabled:'你的帳號目前不能讓頁面使用 Claude。',prompt_too_large:'內容太長，Claude 一次處理不了。',cancelled:'已停止。',invalid_json:'Claude 回傳的格式不正確，請再按一次「開始」。',queue_overflow:'同時處理的工作太多，請稍後再試。'};
const errMsg=e=>ERR[e&&e.code]||('Claude 發生錯誤：'+((e&&e.message)||e));
function cjson(t){t=String(t||'').replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();try{return JSON.parse(t)}catch(e){}const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)return JSON.parse(t.slice(a,b+1));throw {code:'invalid_json'}}
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let PEER=null;const tell=m=>{try{PEER&&PEER.postMessage({aitm:1,...m},'*')}catch(e){}};
function say(stage,p){$('#st').textContent=stage;if(p!=null)$('#pb').style.width=Math.max(2,Math.min(100,p))+'%';tell({t:'prog',stage,p})}
function msg(id,t,cls){const el=$(id);el.hidden=!t;el.textContent=t||'';el.className='msg'+(cls?' '+cls:'')}

/* 1. 讀取 App 複製的工作 */
function parse(){const v=$('#inp').value.trim();JOB=null;$('#job').hidden=true;$('#go').disabled=true;msg('#m1','');
  if(!v)return;const i=v.indexOf('AITM-JOB:');if(i<0){msg('#m1','這不是 App 複製的內容。請回到 App 按「✨ 用 Claude 整理」再貼上一次。','bad');return}
  try{JOB=JSON.parse(v.slice(i+9))}catch(e){msg('#m1','內容不完整（可能只貼上一部分），請回到 App 再複製一次。','bad');return}
  const d=[];if(JOB.k=='tr'){d.push(['工作','翻譯成 '+(JOB.tname||JOB.tgt)],['字數',JOB.text.length+' 字'])}
  else{d.push(['會議',JOB.title||'（未命名）'],['逐字稿',JOB.lines.length+' 句'],['工作',JOB.what=='fix'?'修正錯字':JOB.what=='sum'?'整理重點':'修正錯字＋整理重點'])}
  $('#job').innerHTML=d.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('');$('#job').hidden=false;$('#go').disabled=!sample;
  if(!sample)msg('#m1','這一頁要在 claude.ai 登入後開啟，才能使用你的 Claude 方案。','bad')}
$('#inp').addEventListener('input',parse);
$('#inp').addEventListener('paste',()=>setTimeout(()=>{parse();if(JOB&&sample&&!busy)run()},50));
$('#go').onclick=()=>{if(JOB&&!busy)run()};
$('#stop').onclick=()=>ctl&&ctl.abort();

/* 2. 用 Claude 處理 */
async function ask(prompt,o={}){return await sample(prompt,{modelTier:o.tier||'default',signal:ctl.signal,cache:false,onText:o.onText})}
async function run(){busy=true;RES='';say('準備中…',2);ctl=new AbortController();$('#go').disabled=true;$('#stop').hidden=false;$('#c2').hidden=false;$('#c3').hidden=true;msg('#m1','');
  t0=Date.now();clearInterval(tick);tick=setInterval(()=>{$('#mt').textContent='已進行 '+fmt((Date.now()-t0)/1000)+'・Claude 思考時畫面可能停幾十秒，屬正常'},1000);
  try{let out;
    if(JOB.k=='tr'){say('翻譯中（Claude 思考中…）',5);
      const r=await ask(`把下面的文字翻譯成${JOB.tname}。保留段落與換行、人名、數字、單位、產品代碼與網址；用母語人士自然的寫法${/Chinese/.test(JOB.tname)?'，使用全形中文標點':''}。只輸出譯文，不要任何說明。${JOB.terms?'\n專有名詞的正確寫法：'+JOB.terms:''}\n\n${JOB.text}`,{onText:({text})=>{say('翻譯中…已寫 '+text.length+' 字',Math.min(95,10+text.length/JOB.text.length*80));show({k:'tr',t:text},1)}});
      out={k:'tr',id:JOB.id||'',t:r.text.trim()}}
    else{out={k:'meet',id:JOB.id,fix:{},sum:null};const L=JOB.lines;const doFix=JOB.what!='sum',doSum=JOB.what!='fix';
      if(doFix){const B=[];let cur=[],n=0;for(const l of L){const s=`${l[0]}|${l[1]}|${l[3]}`;if(n+s.length>3500&&cur.length){B.push(cur);cur=[];n=0}cur.push(l);n+=s.length}if(cur.length)B.push(cur);
        let done=0;say(`修正錯字 0/${B.length} 段（Claude 思考中…）`,3);
        const one=async b=>{const r=await ask(FIX+(JOB.hint?'\n\n'+JOB.hint:'')+'\n\n逐字稿：\n'+b.map(l=>`${l[0]}|${l[1]}|${l[3]}`).join('\n'));let o={};try{o=cjson(r.text)}catch(e){}
          const ok=new Set(b.map(l=>String(l[0])));for(const [k,v] of Object.entries(o))if(ok.has(String(k))&&typeof v=='string'&&v.trim())out.fix[k]=v.trim();
          done++;say(`修正錯字 ${done}/${B.length} 段`,(doSum?55:95)*done/B.length)};
        for(let i=0;i<B.length;i+=2)await Promise.all(B.slice(i,i+2).map(one))}
      if(doSum){const txt=L.map(l=>`[${fmt(l[2])}] ${l[1]}：${out.fix[l[0]]||l[3]}`).join('\n').slice(0,300000);say('整理重點（Claude 思考中…）',doFix?58:8);
        const r=await ask(SUM+(JOB.hint?'\n\n'+JOB.hint:'')+'\n\n會議資訊：'+(JOB.title||'')+'\n\n逐字稿：\n'+txt,{onText:({text})=>say('整理重點…已寫 '+text.length+' 字',Math.min(96,(doFix?60:10)+text.length/45))});
        out.sum=cjson(r.text);out.sum.by='claude.ai'}}
    RES='AITM-RES:'+JSON.stringify({v:1,...out});say('完成',100);show(out);tell({t:'res',res:RES});
  }catch(e){msg('#m1',errMsg(e),e&&e.code=='cancelled'?'':'bad');say('沒有完成',null);tell({t:'err',code:e&&e.code||'',msg:errMsg(e)})}
  finally{busy=false;clearInterval(tick);$('#mt').textContent='花了 '+fmt((Date.now()-t0)/1000);$('#go').disabled=!JOB;$('#stop').hidden=true}}

/* 3. 顯示結果＋複製 */
function show(o,partial){$('#c3').hidden=false;$('#cp').disabled=!!partial;let h='';
  if(o.k=='tr')h=`<div class="out">${esc(o.t)}</div>`;
  else{const s=o.sum,n=Object.keys(o.fix||{}).length;if(JOB.what!='sum')h+=`<p class="msg ok">修正了 ${n} 句的錯字</p>`;
    if(s)h+=`<div class="sum">${s.overview?`<h3>摘要</h3><p class="ov">${esc(s.overview)}</p>`:''}${(s.chapters||[]).map(c=>`<h3>${esc(c.title)}<span class="t">${esc(c.start||'')}${c.end?'–'+esc(c.end):''}</span></h3>${c.summary?`<p class="ov">${esc(c.summary)}</p>`:''}<ul>${(c.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`).join('')}${(s.decisions||[]).length?`<h3>決議事項</h3><ul>${s.decisions.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}${(s.actions||[]).length?`<h3>待辦事項</h3><ul>${s.actions.map(a=>`<li>${esc(a.owner||'未指定')}：${esc(a.task)}${a.due?'（'+esc(a.due)+'）':''}</li>`).join('')}</ul>`:''}</div>`}
  $('#view').innerHTML=h;$('#raw').value=partial?'':RES;msg('#m3','')}
$('#cp').onclick=async()=>{if(!RES)return;try{await navigator.clipboard.writeText(RES);msg('#m3','✅ 已複製，請回到 App','ok')}catch(e){const r=$('#raw');r.closest('details').open=true;r.focus();r.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}msg('#m3',ok?'✅ 已複製，請回到 App':'請在下方框框長按 → 全選 → 複製',ok?'ok':'')}};

/* App 內建的 Claude 視窗：App 直接把工作傳進來，完成後自動把結果送回 App（不用複製貼上） */
const SPR=initS();let LASTJ='';addEventListener('message',e=>{const d=e.data;if(!d||d.aitm!==1||d.t!=='job'||typeof d.job!='string')return;PEER=e.source;tell({t:'ack'});
 if(busy||d.job===LASTJ)return;const go=()=>{if(!sample){tell({t:'err',code:'no_sample',msg:'這一頁還沒取得 Claude（請確認已登入 claude.ai）'});return}LASTJ=d.job;$('#inp').value=d.job;parse();if(JOB)run()};
 SPR.then(go)});
async function initS(){try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sample=null}
  if(!sample)msg('#m1','這一頁要在 claude.ai 登入後開啟，才能使用你的 Claude 方案。','bad');parse()}
</script>
